[build]
  publish = "."

# Pretty, shareable URL for the link tree (primary entry point)
[[redirects]]
  from = "/"
  to = "/fawaz_link_tree.html"
  status = 200

[[redirects]]
  from = "/links"
  to = "/fawaz_link_tree.html"
  status = 200

[[redirects]]
  from = "/fawaz"
  to = "/fawaz_link_tree.html"
  status = 200

